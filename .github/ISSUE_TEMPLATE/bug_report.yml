name: 🐛 Laporan Bug
description: Laporkan perilaku yang tidak beres
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melaporkan bug! Isi detail di bawah agar bisa ditindaklanjuti dengan cepat.

  - type: dropdown
    id: area
    attributes:
      label: Di bagian mana bug muncul?
      options:
        - "Portal Guru"
        - "Portal Siswa"
        - "Login / Autentikasi"
        - "Build / Deploy"
        - "Dokumentasi"
        - "Lainnya"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      description: Minimal 2 langkah dari kondisi normal.
      placeholder: |
        1. Masuk sebagai guru
        2. Buka menu Kelas → ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang diharapkan
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Perilaku yang terjadi
      description: Sertakan screenshot / log console bila ada.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "contoh: Chrome 120, Windows 11"

  - type: dropdown
    id: deploy
    attributes:
      label: Di mana Anda menjalankan aplikasi?
      options:
        - "npm run dev (lokal)"
        - "GitHub Pages (deploy sendiri)"
        - "Hosting lain (Vercel/Netlify/dll)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Konfirmasi
      options:
        - label: Migration SQL Supabase sudah dijalankan semua
        - label: Sudah mencoba restart dev server / build ulang
