name: Deploy ke GitHub Pages

# Build aplikasi lalu deploy ke GitHub Pages setiap kali ada push ke main.
# Jalankan juga manual lewat tab Actions → Deploy ke GitHub Pages → Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tentukan base path dari nama repo
        # Project Pages disajikan di https://<user>.github.io/<repo>/ sehingga
        # semua aset harus dibangun dengan base /<repo>/.
        run: echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
          # Opsional: jika tidak ingin menaruh anon key di public/config.js,
          # set repository secrets VITE_SUPABASE_URL & VITE_SUPABASE_ANON_KEY
          # (Settings → Secrets and variables → Actions).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: SPA fallback untuk GitHub Pages
        # GitHub Pages hanya menyajikan file statis. Dengan menyalin index.html
        # sebagai 404.html, URL dalam (mis. /<repo>/student/dashboard) tetap
        # mendapatkan aplikasi dan React Router membaca path aslinya.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
