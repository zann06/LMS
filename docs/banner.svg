<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RuangAjar banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf3e8"/>
      <stop offset="1" stop-color="#f3e6d3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4573b"/>
      <stop offset="1" stop-color="#d07a55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- dekorasi: lingkaran tipis di kanan -->
  <g fill="none" stroke="#b4573b" stroke-opacity="0.10">
    <circle cx="1180" cy="40" r="150" stroke-width="2"/>
    <circle cx="1180" cy="40" r="110" stroke-width="2"/>
    <circle cx="1180" cy="40" r="70" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#b4573b" stroke-opacity="0.08">
    <circle cx="90" cy="300" r="120" stroke-width="2"/>
    <circle cx="90" cy="300" r="80" stroke-width="2"/>
  </g>

  <!-- logo: topi wisuda di rounded square -->
  <g transform="translate(96,88)">
    <rect width="144" height="144" rx="32" fill="url(#accent)"/>
    <g fill="#fdf6ec" transform="translate(24,24) scale(1.5)">
      <path d="M32 13 L57 23.5 L32 34 L7 23.5 Z"/>
      <path d="M19.5 27.5 L19.5 38 Q19.5 47 32 47 Q44.5 47 44.5 38 L44.5 27.5 L32 33.2 Z" opacity="0.95"/>
      <rect x="55.2" y="23.5" width="2.4" height="13" rx="1.2"/>
      <circle cx="56.4" cy="39.5" r="3.2"/>
    </g>
  </g>

  <!-- judul -->
  <text x="300" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#2e2117">RuangAjar</text>
  <text x="304" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#6b5442">Learning Management System untuk Guru &amp; Siswa</text>

  <!-- chip teknologi -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="304" y="226" width="118" height="42" rx="21" fill="#2e2117" fill-opacity="0.08"/>
    <text x="332" y="253" fill="#7a4a33">React 19</text>
    <rect x="434" y="226" width="118" height="42" rx="21" fill="#2e2117" fill-opacity="0.08"/>
    <text x="460" y="253" fill="#7a4a33">TypeScript</text>
    <rect x="564" y="226" width="102" height="42" rx="21" fill="#2e2117" fill-opacity="0.08"/>
    <text x="592" y="253" fill="#7a4a33">Vite 7</text>
    <rect x="678" y="226" width="140" height="42" rx="21" fill="#2e2117" fill-opacity="0.08"/>
    <text x="704" y="253" fill="#7a4a33">Tailwind 4</text>
    <rect x="830" y="226" width="122" height="42" rx="21" fill="#2e2117" fill-opacity="0.08"/>
    <text x="858" y="253" fill="#7a4a33">Supabase</text>
  </g>

  <!-- garis aksen bawah -->
  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)"/>
</svg>
